<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veil</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: 160px;
      box-sizing: border-box;
    }

    .box {
      border: 1px solid #8886;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0 16px;
      white-space: pre-wrap;
      min-height: 24px;
    }

    .local {
      color: #0a7d3b;
    }

    .cloud {
      color: #1a5fd0;
    }

    button,
    select {
      padding: 8px 14px;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <h1>Veil</h1>
  <p>Ask AI about private documents. Personal details never leave your device.</p>

  <textarea id="doc" placeholder="Paste a document here (lease, lab report, offer letter...)"></textarea>
  <p>
    <select id="task">
      <option value="Explain this document in simple language.">Explain simply</option>
      <option value="Flag any risky or unusual clauses and say why.">Flag risks</option>
      <option value="List the questions I should ask before agreeing to this.">Questions to ask</option>
    </select>
    <button id="go">Analyze</button>
  </p>

  <h3>1. What the cloud sees</h3>
  <div id="safe" class="box"></div>

  <h3>2. Answer (your details restored locally)</h3>
  <div id="answer" class="box"></div>

  <h3>Routing Ledger</h3>
  <div id="ledger" class="box"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
